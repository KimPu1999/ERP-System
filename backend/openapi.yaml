openapi: 3.1.0
info:
  title: Enterprise ERP Cloud API
  version: 0.1.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: API health check
      responses:
        '200': { description: Healthy }
  /me:
    get:
      security: [{ sanctum: [] }]
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Current user }
        '403': { description: Tenant access denied }
  /platform/summary:
    get:
      summary: Platform overview metrics
      description: Returns live platform metrics and recent activity for verified active Super Admins.
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: Platform overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSummaryResponse' }
        '401': { description: Unauthenticated }
        '403': { description: Platform access denied }
  /platform/users:
    get:
      summary: List platform administrators
      security: [{ sanctum: [] }]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Paginated platform administrators
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformUserPageResponse' }
        '401': { description: Unauthenticated }
        '403': { description: Platform access denied }
  /platform/users/{user}/status:
    patch:
      summary: Change a platform administrator status
      security: [{ sanctum: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        '200': { description: Status updated }
        '403': { description: Operation denied, including last-admin protection }
        '422': { description: Validation error }
  /platform/audit-logs:
    get:
      summary: List platform audit logs
      security: [{ sanctum: [] }]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Paginated privileged platform actions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAuditPageResponse' }
        '403': { description: Platform access denied }
  /platform/security/events:
    get:
      summary: List security events
      security: [{ sanctum: [] }]
      parameters:
        - { $ref: '#/components/parameters/Search' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200': { description: Paginated security events }
        '403': { description: Platform access denied }
  /platform/settings:
    get:
      summary: Read safe platform security settings
      security: [{ sanctum: [] }]
      responses:
        '200': { description: Non-secret platform security configuration }
        '403': { description: Platform access denied }
  /platform/analytics:
    get:
      summary: Platform analytics
      description: Returns live six-month registration trends and status aggregates for verified active Super Admins.
      security: [{ sanctum: [] }]
      responses:
        '200':
          description: Platform analytics data
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [period, business_growth, businesses_by_status, subscriptions_by_state, platform_users_by_status]
                    properties:
                      period: { type: object, additionalProperties: { type: string, format: date-time } }
                      business_growth: { type: array, items: { type: object, additionalProperties: true } }
                      businesses_by_status: { type: array, items: { type: object, additionalProperties: true } }
                      subscriptions_by_state: { type: array, items: { type: object, additionalProperties: true } }
                      platform_users_by_status: { type: array, items: { type: object, additionalProperties: true } }
        '403': { description: Platform access denied }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer }
  parameters:
    Search:
      in: query
      name: search
      required: false
      schema: { type: string }
    PerPage:
      in: query
      name: per_page
      required: false
      schema: { type: integer, minimum: 10, maximum: 100, default: 25 }
    UserId:
      in: path
      name: user
      required: true
      schema: { type: string, description: Laravel ULID identifier }
  schemas:
    PlatformSummaryResponse:
      type: object
      required: [summary]
      properties:
        summary:
          type: object
          properties:
            total_businesses: { type: integer }
            active_businesses: { type: integer }
            pending_approvals: { type: integer }
            total_platform_users: { type: integer }
            active_subscriptions: { type: integer }
            system_alerts: { type: object, additionalProperties: { type: integer } }
            business_growth: { type: array, items: { type: object, additionalProperties: true } }
            recent_registrations: { type: array, items: { type: object, additionalProperties: true } }
            recent_activities: { type: array, items: { type: object, additionalProperties: true } }
    PlatformUserPageResponse:
      type: object
      properties:
        summary: { type: object, additionalProperties: { type: integer } }
        data: { type: object, additionalProperties: true }
    PlatformAuditPageResponse:
      type: object
      properties:
        data: { type: object, additionalProperties: true }
