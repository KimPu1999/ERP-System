openapi: 3.1.0
info:
  title: Enterprise ERP Cloud API
  version: 0.1.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: API health check
      responses:
        '200': { description: Healthy }
  /me:
    get:
      security: [{ sanctum: [] }]
      parameters:
        - in: header
          name: X-Tenant-Id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Current user }
        '403': { description: Tenant access denied }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer }
