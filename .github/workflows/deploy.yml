name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment protected by GitHub environment approvals
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release documentation exists
        run: test -f docs/release-checklist.md && test -f docs/backup-restore.md
      - name: Build web artifact
        working-directory: apps/web
        run: |
          npm install
          npm run check
          npm run build
      - name: Validate API release artifact
        working-directory: backend
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer lint
          php artisan route:list --json > /tmp/erp-routes.json
      - name: Deployment contract
        run: |
          test -n "${{ secrets.DEPLOYMENT_RUNNER_URL }}"
          echo "Release artifacts verified for ${{ inputs.environment }}; the protected deployment runner must consume this workflow's artifact and report health/rollback status."
