name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: erp_test
      DB_USERNAME: erp
      DB_PASSWORD: erp
      DB_SSLMODE: prefer
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_DB: erp_test, POSTGRES_USER: erp, POSTGRES_PASSWORD: erp }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp -d erp" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4.1', extensions: pdo_pgsql, coverage: none }
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --no-interaction --format=plain
      - run: composer lint
      - run: php artisan test
      - run: php artisan migrate --force
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm run test -- --run
