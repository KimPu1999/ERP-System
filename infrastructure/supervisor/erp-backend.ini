; Supervisor group for ERP Cloud backend daemons (Option A / self-managed VPS).
; One supervisor instance runs the queue workers. The scheduler runs via ONE cron
; entry calling `php artisan schedule:run` (see docs/deployment/QUEUE_SCHEDULER_SETUP.md)
; — do not also run `schedule:work` on the same host.
;
; Install: sudo cp *.ini /etc/supervisor/conf.d/ && sudo supervisorctl reread
; Environment overrides come from a root-readable env file, never from this
; repository: /etc/erp-backend/worker.env (root:root 0600 syntax: KEY="value").
; To reload code, workers must be restarted after every release:
;   sudo supervisorctl restart erp-backend:*   (or the release script does it)
;
; Notes:
; - `stopwaitsecs` must exceed the queue job `timeout` so a worker finishing a
;   posting transaction is not SIGKILLed mid-commit.
; - One queue group; jobs are idempotent by design (outbox/idempotency keys),
;   but keep max_tries low so retries do not duplicate financial side effects.
[program:erp-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/erp-api/current/artisan queue:work redis --sleep=3 --tries=3 --backoff=10 --max-time=3600 --memory=256 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
numprocs_start=0
environment=USER="erp-deploy",HOME="/home/erp-deploy"
directory=/var/www/erp-api/current
startsecs=5
stopwaitsecs=130
priority=10
stdout_logfile=/var/log/erp-backend/worker-%(process_num)02d.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=7
stderr_logfile=/var/log/erp-backend/worker-%(process_num)02d.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=7

[group:erp-backend]
programs=erp-queue
