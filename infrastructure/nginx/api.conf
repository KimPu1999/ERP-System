# Laravel API — Nginx site for PHP-FPM (Option A / self-managed VPS template).
# Template only: replace erp-api.internal with the actual API hostname before use.
# The web root MUST be the Laravel public/ directory. Do not point one server block
# at both the frontend SPA and this API; they are separate origins (app/api split).

server {
    listen 80;
    server_name erp-api.internal;

    # Pre-TLS ACME challenge handling; everything else is redirected to HTTPS
    # (uncomment when running behind a certificate manager such as acme.sh/certbot).
    # include /etc/nginx/snippets/acme-challenge.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp-api.internal;

    # Certificate paths are environment-specific (managed by the certificate
    # automation chosen for the server; see docs/deployment/DOMAIN_HTTPS_SETUP.md).
    # ssl_certificate     /etc/ssl/erp/fullchain.pem;
    # ssl_certificate_key /etc/ssl/erp/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_prefer_server_ciphers off;
    # ssl_session_timeout 1d;
    # ssl_session_cache shared:erp_tls:10m;

    # --- Security headers (mirrors backend SecurityHeaders middleware intent) ---
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/erp-api/current/public;
    index index.php index.html;

    client_max_body_size 20m;

    # Never serve hidden files (.env, .git, .well-known except ACME).
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Never serve internal artifacts or storage contents directly.
    location ~* /(vendor|storage|database|tests|bootstrap/caches?) {
        deny all;
    }

    # Laravel-generated caches (config/routes/views) live under bootstrap/cache.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-cache immutable hashed assets if the API ever serves any.
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php(/.*)?$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)?$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_intercept_errors on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.4-fpm-erp.sock;
        fastcgi_read_timeout 120s;
    }
}
